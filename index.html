<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NetAcad Lab Reports</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: a report shelf (two selectable report cards) above a continuous page-by-page PDF reader */
:root {
  --bg: #eef2f6; --surface: #ffffff; --ink: #142233; --muted: #5a6b7d; --line: #d5dde6;
  --accent: #0b6fb3; --navy: #10324f; --ok: #1d7a3e; --bad: #b42318; --paper-shadow: rgba(16,50,79,.14);
  --f-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1620; --surface: #15212d; --ink: #e3ebf3; --muted: #93a4b6; --line: #273748;
  --accent: #5bb3ef; --navy: #9fc9ea; --ok: #5cc785; --bad: #f2867c; --paper-shadow: rgba(0,0,0,.5); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0d1620; --surface: #15212d; --ink: #e3ebf3; --muted: #93a4b6; --line: #273748;
  --accent: #5bb3ef; --navy: #9fc9ea; --ok: #5cc785; --bad: #f2867c; --paper-shadow: rgba(0,0,0,.5); color-scheme: dark }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-body); }
.wrap { max-width: 980px; margin: 0 auto; padding-block: 32px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 24px; }
header { display: grid; gap: 6px; }
.eyebrow { font: 600 12px/1 var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
h1 { font: 600 clamp(26px, 5vw, 36px)/1.15 var(--f-display); margin: 0; color: var(--navy); text-wrap: balance; }
header p { margin: 0; color: var(--muted); max-width: 62ch; }
.shelf { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.card { text-align: left; font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; padding: 18px 20px; cursor: pointer; display: grid; gap: 12px; min-width: 0; }
.card:hover { border-color: var(--accent); }
.card:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.card[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.card h2 { font: 600 19px/1.2 var(--f-display); margin: 0; color: var(--navy); }
.card .sub { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
.scores { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 12px/1 var(--f-mono); padding: 6px 8px; border-radius: 5px; border: 1px solid var(--line);
  font-variant-numeric: tabular-nums; }
.chip b { font-weight: 500; }
.chip.ok b { color: var(--ok); } .chip.bad b { color: var(--bad); }
.chip span { color: var(--muted); margin-right: 4px; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px;
  border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.toolbar .name { font: 600 15px/1.3 var(--f-display); min-width: 0; }
.toolbar .meta { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.btn { font: 600 14px/1 var(--f-body); border: 0; border-radius: 7px; padding: 11px 16px; cursor: pointer;
  background: var(--accent); color: var(--surface); }
.btn:disabled { opacity: .55; cursor: default; }
.status { font-size: 13px; color: var(--muted); }
.pages { display: grid; gap: 18px; justify-items: center; }
.page { width: 100%; max-width: 820px; background: #fff; box-shadow: 0 2px 14px var(--paper-shadow); border-radius: 2px; position: relative; }
.page canvas { display: block; width: 100%; height: auto; }
.page .no { position: absolute; right: 8px; bottom: -18px; font: 500 11px/1 var(--f-mono); color: var(--muted); }
.loading { color: var(--muted); padding: 40px 0; text-align: center; }
@media (prefers-reduced-motion: no-preference) { .card { transition: border-color .15s, box-shadow .15s; } }
</style>
</head>
<body>


<div class="wrap">
  <header>
    <div class="eyebrow">Cisco Networking Academy · 2026/27</div>
    <h1>Lab reports</h1>
    <p>Two course reports with every hands-on lab solved, run in the NetAcad editor and documented with screenshots. Pick a report to read it here or save the PDF.</p>
  </header>

  <div class="shelf" role="group" aria-label="Reports">
    <button class="card" id="card-cppe2" data-key="cppe2" aria-pressed="true">
      <div><h2>C++ Essentials 2</h2><div class="sub">50 labs · Modules 1–4 · 121 pages</div></div>
      <div class="scores">
        <span class="chip bad"><span>M1 test</span><b>50%</b></span>
        <span class="chip ok"><span>M2 test</span><b>80%</b></span>
      </div>
    </button>
    <button class="card" id="card-jse2" data-key="jse2" aria-pressed="false">
      <div><h2>JavaScript Essentials 2</h2><div class="sub">Modules 1–4 · 64 pages</div></div>
      <div class="scores">
        <span class="chip ok"><span>M1</span><b>89%</b></span>
        <span class="chip ok"><span>M2</span><b>100%</b></span>
        <span class="chip ok"><span>M3</span><b>96%</b></span>
        <span class="chip ok"><span>M4</span><b>95%</b></span>
        <span class="chip ok"><span>Final</span><b>88%</b></span>
      </div>
    </button>
  </div>

  <div class="toolbar">
    <div style="min-width:0"><div class="name" id="cur-name">C++ Essentials 2</div><div class="meta" id="cur-meta">Loading…</div></div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <a class="btn" id="dl" href="CPPE2_Lab_Report.pdf" download style="text-decoration:none">Download PDF</a>
    </div>
  </div>

  <div class="pages" id="pages"><div class="loading">Loading the report…</div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script>
const REPORTS = {
  cppe2: { file: 'CPPE2_Lab_Report.pdf', name: 'C++ Essentials 2', save: 'CPPE2_Lab_Report.pdf' },
  jse2:  { file: 'JSE2_Lab_Report.pdf',  name: 'JavaScript Essentials 2', save: 'JSE2_Lab_Report.pdf' },
};
const cache = {};
let current = null, token = 0, observer = null;
const $ = id => document.getElementById(id);

async function getBytes(key) {
  if (!cache[key]) cache[key] = fetch(REPORTS[key].file).then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); });
  return cache[key];
}

async function show(key) {
  current = key; const my = ++token;
  for (const c of document.querySelectorAll('.card')) c.setAttribute('aria-pressed', String(c.dataset.key === key));
  $('cur-name').textContent = REPORTS[key].name; $('cur-meta').textContent = 'Loading…'; $('dl').href = REPORTS[key].file; $('dl').setAttribute('download', REPORTS[key].save);
  const box = $('pages'); box.innerHTML = '<div class="loading">Loading the report…</div>';
  if (observer) observer.disconnect();
  try {
    const buf = await getBytes(key);
    const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(buf.slice(0)) }).promise;
    if (my !== token) return;
    $('cur-meta').textContent = pdf.numPages + ' pages · ' + (buf.byteLength / 1048576).toFixed(1) + ' MB';
    const first = await pdf.getPage(1); const vp0 = first.getViewport({ scale: 1 });
    box.innerHTML = '';
    observer = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { observer.unobserve(e.target); render(pdf, e.target, my); } }), { rootMargin: '800px 0px' });
    for (let i = 1; i <= pdf.numPages; i++) {
      const d = document.createElement('div'); d.className = 'page'; d.dataset.n = i;
      d.style.aspectRatio = vp0.width + ' / ' + vp0.height;
      const n = document.createElement('span'); n.className = 'no'; n.textContent = i + ' / ' + pdf.numPages; d.appendChild(n);
      box.appendChild(d); observer.observe(d);
    }
  } catch (e) {
    if (my === token) { box.innerHTML = ''; const m = document.createElement('div'); m.className = 'loading'; m.textContent = 'The report could not be loaded. Reload the page to try again.'; box.appendChild(m); $('cur-meta').textContent = ''; }
  }
}

async function render(pdf, el, my) {
  if (my !== token) return;
  const page = await pdf.getPage(+el.dataset.n);
  const scale = Math.min(2.5, (el.clientWidth * (window.devicePixelRatio || 1)) / page.getViewport({ scale: 1 }).width);
  const vp = page.getViewport({ scale });
  const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
  el.style.aspectRatio = ''; el.prepend(c);
  await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
}

document.querySelectorAll('.card').forEach(c => c.addEventListener('click', () => { if (c.dataset.key !== current) location.hash = c.dataset.key; }));

const pick = () => show(REPORTS[location.hash.slice(1)] ? location.hash.slice(1) : 'cppe2');
window.addEventListener('hashchange', () => { if (location.hash.slice(1) !== current) pick(); });
pick();
</script>

</body>
</html>
